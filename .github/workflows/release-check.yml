name: Release checks

on:
  pull_request:
  push:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python tests/platform-database.test.py
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npm run cloudflare:check
